<div class="app-layout" [class.auth-layout]="isAuthPage()">
  <!-- Sidebar -->
  <aside class="sidebar" *ngIf="!isAuthPage()">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <img src="/logo.jpg" alt="SAFE Track logo" class="logo-img" />
      </div>
      <span class="logo-text">SAFE <span class="logo-accent">Track</span></span>
    </div>

    <nav class="sidebar-nav">
      @for (item of menuItems; track item.label) {
        <a
          class="nav-item"
          [class.active]="item.active"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <i class="nav-icon" [class]="item.icon"></i>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

  </aside>

  <!-- Main content -->
  <div class="main-wrapper" *ngIf="!isAuthPage()">
    <!-- Header -->
    <header class="topbar">
      <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" class="search-input" placeholder="Rechercher un équipement" />
      </div>
      <div class="topbar-actions">
        <div class="action-btn notification-btn">
          <i class="fa-regular fa-bell"></i>
          <span class="notification-badge">8</span>
        </div>
        <div class="action-btn">
          <i class="fa-regular fa-circle-question"></i>
        </div>
        <div class="profile-chip">
          <div class="profile-avatar">{{ currentUser?.name?.charAt(0)?.toUpperCase() || 'SA' }}</div>
          <span class="profile-name">{{ currentUser?.name || 'Super Admin' }}</span>
          <i class="fa-solid fa-chevron-down profile-chevron"></i>
        </div>
      </div>
    </header>

    <!-- Page content -->
    <main class="page-content">
      <router-outlet />
    </main>
  </div>
  <router-outlet *ngIf="isAuthPage()" />
</div>
