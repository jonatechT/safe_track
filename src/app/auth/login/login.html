<div class="login-page">
  <div class="login-card">
    <!-- Left side - Form -->
    <div class="login-form-section">
      <div class="login-header">
        <h1 class="login-title">Bienvenue</h1>
        <p class="login-subtitle">Connectez-vous à votre compte pour accéder à la plateforme</p>
      </div>

      @if (errorMessage()) {
        <div class="error-message">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input
              type="email"
              class="form-input"
              placeholder="ali@gmail.com"
              [(ngModel)]="email"
              name="email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              [type]="showPassword() ? 'text' : 'password'"
              class="form-input"
              placeholder="••••••••"
              [(ngModel)]="password"
              name="password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              (click)="showPassword.set(!showPassword())"
            >
              <i [class]="showPassword() ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
            </button>
          </div>
        </div>

        <div class="remember-forgot">
          <label class="remember-checkbox">
            <input type="checkbox" />
            <span>Se souvenir de moi</span>
          </label>
          <a href="#" class="forgot-link">Mot de passe oublié ?</a>
        </div>

        <button
          type="submit"
          class="login-button"
          [class.loading]="isLoading()"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <div class="spinner"></div>
          } @else {
            <span>Se connecter</span>
          }
        </button>
      </form>

      <div class="login-footer">
        <p>
          Pas de compte ?
          <a routerLink="/register" class="register-link">Créer un compte</a>
        </p>
      </div>
    </div>

    <!-- Right side - Decorative -->
    <div class="login-decorative-section">
      <div class="decorative-content">
        <div class="decorative-logo-container">
          <img src="logo.jpg" alt="Safe Track" class="decorative-logo" />
        </div>
        <h2 class="decorative-title">SAFE Track</h2>
        <p class="decorative-subtitle">Sécurisez vos équipements, prévenez les pannes</p>
      </div>
    </div>
  </div>
</div>
