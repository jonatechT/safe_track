<div class="auth-page">
  <div class="auth-card">
    <!-- Logo -->
    <div class="logo-container">
      <img src="logo.png" alt="Safe Track" class="auth-logo" />
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <a routerLink="/login" class="auth-tab">CONNECTION</a>
      <a routerLink="/register" class="auth-tab active">INSCRIPTION</a>
    </div>

    @if (errorMessage) {
      <div class="error-message">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-grid">
        <div class="form-group">
          <div class="input-wrapper">
            <input
              id="firstName"
              type="text"
              class="form-input"
              placeholder="Prénom"
              [(ngModel)]="firstName"
              name="firstName"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <input
              id="lastName"
              type="text"
              class="form-input"
              placeholder="Nom"
              [(ngModel)]="lastName"
              name="lastName"
              required
            />
          </div>
        </div>
      </div>

        <div class="form-group">
          <div class="input-wrapper">
            <input
              id="identifier"
            type="text"
            class="form-input"
            placeholder="Email ou Numéro"
            [(ngModel)]="identifier"
            name="identifier"
            required
          />
        </div>
      </div>

        <div class="form-group">
          <div class="input-wrapper">
            <input
              id="structure"
            type="text"
            class="form-input"
            placeholder="Structure"
            [(ngModel)]="structure"
            name="structure"
            required
          />
        </div>
      </div>

        <div class="form-group">
          <div class="input-wrapper">
            <input
              id="password"
            [type]="showPassword ? 'text' : 'password'"
            class="form-input"
            placeholder="Mot de passe"
            [(ngModel)]="password"
            name="password"
            required
          />
          <button
            type="button"
            class="toggle-password"
            (click)="showPassword = !showPassword"
          >
            <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
          </button>
        </div>
      </div>

        <div class="form-group">
          <div class="input-wrapper">
            <input
              id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            class="form-input"
            placeholder="Confirmer le mot de passe"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
          />
          <button
            type="button"
            class="toggle-password"
            (click)="showConfirmPassword = !showConfirmPassword"
          >
            <i [class]="showConfirmPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="auth-button"
        [class.loading]="isLoading"
        [disabled]="isLoading"
      >
        @if (isLoading) {
          <div class="spinner"></div>
        } @else {
          <span>CONTINUER</span>
        }
      </button>
    </form>
  </div>
</div>
