<div class="auth-page">
  <!-- Image d'arrière-plan : champ de panneaux solaires au coucher du soleil -->
  <img src="pannaux.jpg" alt="" class="auth-bg" aria-hidden="true" />
  <div class="auth-overlay"></div>

  <!-- Carte d'inscription en verre translucide -->
  <div class="auth-card">
    <header class="auth-header">
      <h1 class="auth-title">Créer un compte</h1>
      <p class="auth-subtitle">Inscrivez-vous en choisissant votre structure</p>
    </header>

    @if (errorMessage()) {
      <div class="error-message" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Prénom -->
      <div class="input-wrapper">
        <input
          id="prenom"
          type="text"
          class="form-input"
          placeholder="Prénom"
          autocomplete="given-name"
          [(ngModel)]="prenom"
          name="prenom"
          required
        />
        <i class="fa-regular fa-user input-icon" aria-hidden="true"></i>
      </div>

      <!-- Nom -->
      <div class="input-wrapper">
        <input
          id="nom"
          type="text"
          class="form-input"
          placeholder="Nom"
          autocomplete="family-name"
          [(ngModel)]="nom"
          name="nom"
          required
        />
        <i class="fa-regular fa-user input-icon" aria-hidden="true"></i>
      </div>

      <!-- Email -->
      <div class="input-wrapper">
        <input
          id="email"
          type="email"
          class="form-input"
          placeholder="Adresse email"
          autocomplete="email"
          [(ngModel)]="email"
          name="email"
          required
        />
        <i class="fa-regular fa-envelope input-icon" aria-hidden="true"></i>
      </div>

      <!-- Téléphone -->
      <div class="input-wrapper">
        <input
          id="telephone"
          type="tel"
          class="form-input"
          placeholder="Téléphone (optionnel)"
          autocomplete="tel"
          [(ngModel)]="telephone"
          name="telephone"
        />
        <i class="fa-solid fa-phone input-icon" aria-hidden="true"></i>
      </div>

      <!-- Mot de passe -->
      <div class="input-wrapper">
        <input
          id="motDePasse"
          [type]="showPassword() ? 'text' : 'password'"
          class="form-input"
          placeholder="Mot de passe (min. 8 caractères)"
          autocomplete="new-password"
          [(ngModel)]="motDePasse"
          name="motDePasse"
          required
        />
        <button
          type="button"
          class="toggle-password"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
        >
          <i [class]="showPassword() ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye'" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Structure -->
      <div class="input-wrapper">
        <select
          id="structureId"
          class="form-input form-select"
          [(ngModel)]="structureId"
          name="structureId"
          required
        >
          <option value="" disabled selected>Choisir une structure</option>
          @for (structure of structures; track structure.id) {
            <option [value]="structure.id">{{ structure.nom }}</option>
          }
        </select>
        <i class="fa-solid fa-building input-icon" aria-hidden="true"></i>
      </div>

      <!-- Bouton S'inscrire -->
      <button
        type="submit"
        class="auth-button"
        [disabled]="isLoading()"
      >
        @if (isLoading()) {
          <span class="spinner" aria-hidden="true"></span>
        } @else {
          <span>S'inscrire</span>
        }
      </button>
    </form>

    <!-- Lien vers la connexion -->
    <div class="auth-footer">
      <p class="auth-footer-text">
        Vous avez déjà un compte ?
        <a routerLink="/login" class="auth-link">Se connecter</a>
      </p>
    </div>
  </div>
</div>
