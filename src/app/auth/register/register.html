<div class="register-page">
  <div class="register-card">
    <!-- Left side - Form -->
    <div class="register-form-section">
      <div class="register-header">
        <h1 class="register-title">Créer un compte</h1>
        <p class="register-subtitle">Rejoignez la plateforme Safe Track dès aujourd'hui</p>
      </div>

    @if (errorMessage) {
      <div class="error-message">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="register-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Nom complet</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input
              type="text"
              class="form-input"
              placeholder="OUEDRAOGO Ali"
              [(ngModel)]="name"
              name="name"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Adresse e-mail</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input
              type="email"
              class="form-input"
              placeholder="ali@gmail.com"
              [(ngModel)]="email"
              name="email"
              required
            />
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Organisation</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-building input-icon"></i>
            <input
              type="text"
              class="form-input"
              placeholder="Nom de l'entreprise"
              [(ngModel)]="organization"
              name="organization"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Fonction</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-briefcase input-icon"></i>
            <input
              type="text"
              class="form-input"
              placeholder="Poste occupé"
              [(ngModel)]="role"
              name="role"
              required
            />
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-input"
              placeholder="••••••••"
              [(ngModel)]="password"
              name="password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              (click)="showPassword = !showPassword"
            >
              <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirmer le mot de passe</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              class="form-input"
              placeholder="••••••••"
              [(ngModel)]="confirmPassword"
              name="confirmPassword"
              required
            />
            <button
              type="button"
              class="toggle-password"
              (click)="showConfirmPassword = !showConfirmPassword"
            >
              <i [class]="showConfirmPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
            </button>
          </div>
        </div>
      </div>

      <button
        type="submit"
        class="register-button"
        [class.loading]="isLoading"
        [disabled]="isLoading"
      >
        @if (isLoading) {
          <div class="spinner"></div>
        } @else {
          <span>Créer le compte</span>
        }
      </button>
    </form>

    <div class="register-footer">
      <p>
        Vous avez déjà un compte ?
        <a routerLink="/login" class="login-link">Se connecter</a>
      </p>
    </div>
    </div>

    <!-- Right side - Decorative -->
    <div class="register-decorative-section">
      <div class="decorative-content">
        <div class="decorative-logo-container">
          <img src="logo.jpg" alt="Safe Track" class="decorative-logo" />
        </div>
        <h2 class="decorative-title">SAFE Track</h2>
        <p class="decorative-subtitle">Sécurisez vos équipements, prévenez les pannes</p>
      </div>
    </div>
  </div>
</div>
